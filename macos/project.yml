# XcodeGen source for EasyShare.xcodeproj.
# Keep target plists and entitlements hand-written; XcodeGen generates those files.

name: EasyShare
options:
  bundleIdPrefix: dev.easyshare
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

# Project-level signing keeps the app and embedded extension on one identity.
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig

packages:
  EasyShareKit:
    path: .

targets:

  EasyShare:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - Info.plist
          - EasyShare.entitlements
    dependencies:
      - package: EasyShareKit
        product: EasyShareKit
      - target: EasyShareExtension
        embed: true
    settings:
      base:
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/EasyShare.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: dev.easyshare.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.5.1"
        CURRENT_PROJECT_VERSION: "5"
        SWIFT_VERSION: "5.0"
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES

  EasyShareExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: ShareExtension
        excludes:
          - Info.plist
          - EasyShareExtension.entitlements
    dependencies:
      - package: EasyShareKit
        product: EasyShareKit
    settings:
      base:
        INFOPLIST_FILE: ShareExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: ShareExtension/EasyShareExtension.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: dev.easyshare.app.ShareExtension
        MARKETING_VERSION: "0.5.1"
        CURRENT_PROJECT_VERSION: "5"
        SWIFT_VERSION: "5.0"
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
